[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cola2"
version = "0.1.0"
description = "Hugging Face compatible Cola2 span-causal Full-DiT inference"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  {name = "Hongcan Guo"},
  {name = "Yian Zhao"},
  {name = "Feng Wang"},
  {name = "Shen Nie"},
  {name = "Guoqiang Wei"},
  {name = "Yan Zeng"},
  {name = "Hengshuang Zhao"},
]
requires-python = ">=3.10"
keywords = [
  "language-model",
  "continuous-latent",
  "diffusion-transformer",
  "semantic-compression",
  "transformers",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.2",
  "transformers>=4.51,<5",
  "safetensors>=0.4",
]

[project.urls]
Homepage = "https://hongcanguo.github.io/Cola2"
Documentation = "https://hongcanguo.github.io/Cola2"

[project.scripts]
cola2-chat = "cola2.cli_chat:main"

[project.optional-dependencies]
test = [
  "build>=1.2",
  "pytest>=8",
  "twine>=5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks/tests"]
addopts = "-q -p no:cacheprovider"
