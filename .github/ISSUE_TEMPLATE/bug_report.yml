name: Bug report
description: Report a reproducible problem in Cola2 code or documentation
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Follow SECURITY.md and use ByteDance's private reporting channels.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest command or code sample that reproduces the issue.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python, PyTorch, Transformers, device, dtype, and checkpoint revision.
      render: text
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Cola2 version or commit
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Relevant logs or run configuration
      description: Remove secrets and personal data. Attach run_config.json when the issue concerns benchmark reproducibility.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and documentation.
          required: true
        - label: This report does not disclose a security vulnerability or sensitive data.
          required: true
